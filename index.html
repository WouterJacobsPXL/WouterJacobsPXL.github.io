<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wouter Jacobs — Git Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1c2128;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --c-main:          #f0c040;
      --c-education:     #4f9ef8;
      --c-dans:          #e05c5c;
      --c-personal:      #56d364;
      --c-international: #bc8cff;
      --c-work:          #f0883e;
      --font: "JetBrains Mono", monospace;
      --lane-w: 22px;
      --row-h:  64px;
      --graph-w: 160px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* TOP BAR */
    #topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(13,17,23,.97);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: stretch;
      height: 44px; padding: 0;
    }
    .tb-left {
      display: flex; align-items: center; gap: 10px;
      padding: 0 18px;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tb-dots { display: flex; gap: 6px; }
    .tb-dot  { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .tb-name { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .tb-name .tb-user { color: var(--c-main); font-weight: 700; }
    .tb-name .tb-sep  { color: var(--border); margin: 0 2px; }
    .tb-name .tb-repo { color: var(--text); }
    .tb-center {
      display: flex; align-items: center;
      padding: 0 16px;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tb-filter-label {
      font-size: 10px; color: var(--muted);
      white-space: nowrap; letter-spacing: .06em; text-transform: uppercase;
    }
    .tb-right {
      display: flex; align-items: center; gap: 5px;
      padding: 0 14px; flex-wrap: wrap; overflow: hidden;
    }
    .branch-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 11px 3px 8px; border-radius: 999px;
      border: 1px solid transparent; cursor: pointer;
      font-size: 11px; font-family: var(--font); font-weight: 500;
      transition: all .2s; background: transparent; user-select: none;
    }
    .pill-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .branch-pill.active  { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); }
    .branch-pill.inactive{ opacity: .3; border-color: transparent; }
    .branch-pill:hover   { opacity: 1 !important; }

    /* PAGE */
    #page {
      display: grid;
      grid-template-columns: 1fr 210px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 120px;
    }

    /* TERMINAL */
    #terminal-section {
      grid-column: 1 / -1;
      background: #010409;
      border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden;
      margin: 20px 0 28px;
    }
    .term-titlebar {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }
    .term-dots { display: flex; gap: 6px; }
    .term-dot  { width: 11px; height: 11px; border-radius: 50%; }
    .term-title-name { flex: 1; text-align: center; font-size: 11px; color: var(--muted); }
    #term-body {
      padding: 14px 20px 2px;
      max-height: 300px; min-height: 100px;
      overflow-y: auto;
    }
    .tl { display: flex; line-height: 1.65; font-size: 12px; margin-bottom: 0; }
    .tl-prompt { color: var(--c-main); white-space: nowrap; user-select: none; margin-right: 8px; flex-shrink: 0; }
    .tl-cmd    { color: var(--text); }
    .tl-out    { display: block; font-size: 12px; line-height: 1.75; color: #c9d1d9;
                 padding: 2px 0 10px 0; white-space: pre; }
    .tl-out .ok  { color: var(--c-personal); }
    .tl-out .err { color: var(--c-dans); }
    .tl-out .dim { color: var(--muted); }
    .tl-out .hi  { color: var(--c-main); font-weight: 600; }
    .tl-out .bl  { color: var(--c-education); }
    .tl-out .rd  { color: var(--c-dans); }
    .tl-out .gr  { color: var(--c-personal); }
    .tl-out .pu  { color: var(--c-international); }
    .tl-out .or  { color: var(--c-work); }
    #term-input-row {
      display: flex; align-items: center;
      padding: 2px 20px 12px;
    }
    .ti-prompt { color: var(--c-main); white-space: nowrap; margin-right: 8px; font-size: 12px; user-select: none; }
    #term-input {
      flex: 1; background: transparent; border: none; outline: none;
      font-family: var(--font); font-size: 12px; color: var(--text);
      caret-color: var(--c-main);
    }
    #term-input::placeholder { color: var(--border); }

    /* GRAPH AREA */
    #graph-area {
      grid-column: 1;
      position: relative;
      min-height: 100px;
    }

    #graph-svg-wrap {
      position: absolute;
      top: 0; left: 0;
      width: var(--graph-w);
      pointer-events: none;
    }
    #graph-svg { display: block; overflow: visible; }

    #commits-list { padding-left: var(--graph-w); }

    .commit-row {
      display: flex; align-items: center;
      height: var(--row-h);
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      opacity: 0; transform: translateX(-12px);
      transition: opacity .35s ease, transform .35s ease, background .15s;
      margin-right: 4px;
    }
    .commit-row:hover     { background: var(--surface); }
    .commit-row.in-view   { opacity: 1; transform: translateX(0); }
    .commit-row.highlighted { background: var(--surface2) !important; }
    .commit-row.branch-hidden { display: none !important; }

    .cr-body { flex: 1; padding: 0 14px; min-width: 0; }

    .cr-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

    .cr-hash { color: var(--muted); font-size: 11px; letter-spacing: .03em; }

    .cr-branch-pill {
      font-size: 10px; font-weight: 600;
      padding: 1px 7px; border-radius: 3px; border: 1px solid; white-space: nowrap;
    }

    .cr-tag {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 10px; font-weight: 700;
      padding: 1px 8px; border-radius: 4px;
      border: 1px solid var(--c-main);
      background: rgba(240,192,64,.1); color: var(--c-main);
    }
    .cr-tag.release { font-size: 11px; padding: 2px 10px; }

    .cr-msg {
      font-size: 13px; font-weight: 500; color: var(--text);
      margin-top: 3px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .cr-msg.is-fail    { text-decoration: line-through; color: var(--c-dans); }
    .cr-msg.is-release { color: var(--c-main); font-weight: 700; }

    .cr-date { font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* SIDEBAR */
    #sidebar {
      grid-column: 2;
      padding-left: 20px; padding-top: 4px;
      position: sticky; top: 56px;
      align-self: flex-start;
      max-height: calc(100vh - 70px); overflow-y: auto;
    }
    .sb-section { margin-bottom: 28px; }
    .sb-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted);
      margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .release-card {
      display: flex; gap: 10px; padding: 8px 10px;
      border-radius: 6px; margin-bottom: 6px; cursor: pointer;
      transition: background .15s; border: 1px solid transparent;
    }
    .release-card:hover { background: var(--surface); border-color: var(--border); }
    .rc-icon { font-size: 16px; color: var(--c-main); margin-top: 1px; }
    .rc-tag  { font-size: 13px; font-weight: 700; color: var(--c-main); }
    .rc-date { font-size: 10px; color: var(--muted); margin-top: 1px; }
    .rc-msg  { font-size: 10px; color: var(--muted); margin-top: 2px; line-height: 1.4; }

    .branch-legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 11px; color: var(--muted); }
    .bl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* SCRUBBER */
    #scrubber {
      position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 2px; z-index: 50;
    }
    .tl-item { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 3px 0; justify-content: flex-end; }
    .tl-label { font-size: 9px; color: var(--border); transition: color .2s; font-family: var(--font); }
    .tl-pip   { width: 5px; height: 5px; border-radius: 50%; background: var(--border); transition: background .2s, transform .2s; }
    .tl-item.active .tl-label { color: var(--c-main); }
    .tl-item.active .tl-pip   { background: var(--c-main); transform: scale(1.6); }

    /* OVERLAY + DETAIL */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 150;
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    #overlay.on { opacity: 1; pointer-events: all; }
    #detail-panel {
      position: fixed; top: 0; right: -480px;
      width: 460px; height: 100vh;
      background: var(--surface); border-left: 1px solid var(--border);
      z-index: 200; transition: right .32s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column;
    }
    #detail-panel.open { right: 0; }
    #dp-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }
    .dp-label { color: var(--muted); font-size: 11px; }
    #dp-close {
      background: none; border: none; color: var(--muted);
      cursor: pointer; font-size: 16px; font-family: var(--font);
      padding: 4px 8px; border-radius: 4px; transition: background .15s, color .15s;
    }
    #dp-close:hover { background: var(--border); color: var(--text); }
    #dp-body { padding: 22px; overflow-y: auto; flex: 1; }
    #dp-hash { font-size: 11px; color: var(--muted); margin-bottom: 10px; font-style: italic; }
    #dp-msg  { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 14px; }
    #dp-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; align-items: center; }
    #dp-desc {
      font-size: 13px; line-height: 1.85; color: #c9d1d9;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 16px; white-space: pre-wrap;
    }
    #dp-footer { margin-top: 16px; }
    .dp-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 4px 12px; border-radius: 5px; font-weight: 600; }
    .dp-badge.fail  { background: rgba(224,92,92,.15); color: var(--c-dans); border: 1px solid var(--c-dans); }
    .dp-badge.merge { background: rgba(240,136,62,.15); color: var(--c-work); border: 1px solid var(--c-work); }
    .dp-date { color: var(--muted); font-size: 12px; }

    /* TOOLTIP */
    #tooltip {
      position: fixed; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 13px; font-size: 11px; color: var(--text);
      pointer-events: none; z-index: 400; opacity: 0; transition: opacity .12s;
      max-width: 300px; box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    #tooltip.on { opacity: 1; }
    #tt-hash { color: var(--muted); margin-bottom: 2px; }
    #tt-msg  { font-weight: 500; }

    /* MOBILE */
    @media (max-width: 800px) {
      :root { --graph-w: 80px; --lane-w: 14px; --row-h: 60px; }
      #sidebar { display: none; }
      #page { grid-template-columns: 1fr; }
      #scrubber { display: none; }
      #detail-panel { width: 100%; right: -100%; }
      .cr-branch-pill { display: none; }
      .tb-center { display: none; }
      #term-body { max-height: 200px; }
    }
    @media (max-width: 500px) {
      :root { --graph-w: 56px; --lane-w: 10px; }
      #topbar { padding: 0; }
      .tb-left { padding: 0 12px; gap: 8px; }
      .tb-right { gap: 4px; padding: 0 8px; }
      .branch-pill { font-size: 9px; padding: 2px 8px 2px 6px; }
    }
  </style>
</head>

  { hash:"c3a5b2d", branch:"education",      year:2021, date:"Sept 2021",            message:"Nieuwe start: inschrijving PXL Digital AON",                          description:"Met een rugzak vol onzekerheid maar ook vastberadenheid begon ik aan Application Development & Systems aan PXL Hasselt. Dit was het echte beginpunt.",                                                                                                                                                                                                                                                                          tags:[], type:"normal" },

  { hash:"e5b7d4f", branch:"education",      year:2022, date:"Juni 2022",            message:"Eerste buizen: extra jaar nodig",                                     description:"Het eerste jaar verliep niet vlekkeloos. Buizen resulteerden in een extra studiejaar. In eerste instantie een teleurstelling, maar al snel herkaderd als een kans om het fundament echt te verstevigen.",                                                                                                                                                                                                                          tags:[], type:"fail" },

  { hash:"j0g2i9e", branch:"work",           year:2024, date:"Zomer 2024",           message:"Zomerjob: Software Developer bij InfoSupport",                        description:"Een maand lang als software developer aan de slag bij InfoSupport. Eerste echte professionele ervaring in een IT-bedrijf, inclusief een gastlezing op de interne kennisavond.",                                                                                                                                                                                                                                              tags:[], type:"normal" },

const BRANCHES = {
  "education":      { color: "#4f9ef8", lane: 0 },
  "dans":           { color: "#e05c5c", lane: 1 },
  "personal-growth":{ color: "#56d364", lane: 2 },
  "international":  { color: "#bc8cff", lane: 3 },
  "work":           { color: "#f0883e", lane: 4 },
};

// Merge arrows: the LAST commit on each side branch curves into education's final commit.
// This visually shows that all life paths converge into "who I am now".
const merges = [
  { from: "n4k6m3i", into: "w3t5v2r" },  // dans (last: Belgisch Kampioen) → afstuderen
  { from: "p6m8o5k", into: "w3t5v2r" },  // personal-growth (last: Startup Coaching) → afstuderen
  { from: "u1r3t0p", into: "w3t5v2r" },  // international (last: BusIT Week) → afstuderen
  { from: "v2s4u1q", into: "w3t5v2r" },  // work (last: Hackathon) → afstuderen
];

// These must match :root CSS vars
const LANE_W    = 22;
const ROW_H     = 64;
const GRAPH_W   = 160;
const NODE_R    = 6;
const LANE_LEFT = 18; // x of lane 0

const activeBranches = new Set(Object.keys(BRANCHES));
let selectedHash = null;

function branchColor(b) { return (BRANCHES[b] || {}).color || "#8b949e"; }
function branchLane(b)  { return BRANCHES[b] != null ? BRANCHES[b].lane : 0; }
function laneX(lane)    { return LANE_LEFT + lane * LANE_W; }
function commitX(b)     { return laneX(branchLane(b)); }
function rowY(i)        { return i * ROW_H + ROW_H / 2; }

function svgEl(tag, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

// ── BUILD ROWS ──
function buildRows() {
  const list = document.getElementById("commits-list");
  list.innerHTML = "";

  commits.forEach(function(c) {
    const color = branchColor(c.branch);
    const row = document.createElement("div");
    row.className = "commit-row";
    row.dataset.hash   = c.hash;
    row.dataset.branch = c.branch;
    row.dataset.year   = c.year;
    if (!activeBranches.has(c.branch)) row.classList.add("branch-hidden");

    const body = document.createElement("div");
    body.className = "cr-body";

    const top = document.createElement("div");
    top.className = "cr-top";

    const hashEl = document.createElement("span");
    hashEl.className = "cr-hash";
    hashEl.textContent = c.hash;

    const bpill = document.createElement("span");
    bpill.className = "cr-branch-pill";
    bpill.textContent = c.branch;
    bpill.style.color = color;
    bpill.style.borderColor = color + "55";
    bpill.style.background  = color + "18";

    top.appendChild(hashEl);
    top.appendChild(bpill);

    c.tags.forEach(function(tag) {
      const tb = document.createElement("span");
      tb.className = "cr-tag" + (c.type === "tag-release" ? " release" : "");
      tb.textContent = (c.type === "tag-release" ? "★ " : "◆ ") + tag;
      top.appendChild(tb);
    });

    const msg = document.createElement("div");
    msg.className = "cr-msg"
      + (c.type === "fail"        ? " is-fail"    : "")
      + (c.type === "tag-release" ? " is-release" : "");
    msg.textContent = c.message;

    const date = document.createElement("div");
    date.className = "cr-date";
    date.textContent = c.date;

    body.appendChild(top);
    body.appendChild(msg);
    body.appendChild(date);
    row.appendChild(body);

    row.addEventListener("click",      function()  { openDetail(c); });
    row.addEventListener("mouseenter", function(e) { showTooltip(e, c); });
    row.addEventListener("mousemove",  moveTooltip);
    row.addEventListener("mouseleave", hideTooltip);

    list.appendChild(row);
  });

  buildSVG();
  buildReleases();
  buildBranchLegend();
  buildScrubber();
  setupObserver();
}

// ── BUILD SVG ──
function buildSVG() {
  const svg = document.getElementById("graph-svg");
  svg.innerHTML = "";

  // Collect visible commits in order
  const vis = [];
  commits.forEach(function(c) {
    if (activeBranches.has(c.branch)) vis.push(c);
  });

  const totalH = vis.length * ROW_H;
  svg.setAttribute("width",  GRAPH_W);
  svg.setAttribute("height", Math.max(totalH, ROW_H));
  document.getElementById("graph-svg-wrap").style.height = Math.max(totalH, ROW_H) + "px";

  if (vis.length === 0) return;

  // -- Draw lane lines first (behind nodes) --
  // Group visible commits by lane, track first/last visIdx per lane
  const laneInfo = {}; // lane -> { color, first, last }
  vis.forEach(function(c, vi) {
    const lane = branchLane(c.branch);
    const color = branchColor(c.branch);
    if (!laneInfo[lane]) {
      laneInfo[lane] = { color: color, first: vi, last: vi };
    } else {
      laneInfo[lane].last = vi;
    }
  });

  Object.keys(laneInfo).forEach(function(lane) {
    const info = laneInfo[lane];
    const x = laneX(parseInt(lane));
    const y1 = rowY(info.first);
    const y2 = rowY(info.last);
    if (y2 > y1) {
      svg.appendChild(svgEl("line", {
        x1: x, y1: y1, x2: x, y2: y2,
        stroke: info.color, "stroke-width": "2", opacity: "0.3"
      }));
    }
  });

  // -- Build hash->visIdx lookup for merge lines --
  const visIdxByHash = {};
  vis.forEach(function(c, vi) { visIdxByHash[c.hash] = vi; });

  // -- Draw bezier connectors between consecutive commits on same branch --
  // track last visIdx per branch
  const lastVisByBranch = {};
  vis.forEach(function(c, vi) {
    if (lastVisByBranch[c.branch] != null) {
      const prevVi = lastVisByBranch[c.branch];
      const x  = commitX(c.branch);
      const y1 = rowY(prevVi);
      const y2 = rowY(vi);
      const mid = (y1 + y2) / 2;
      const color = branchColor(c.branch);
      svg.appendChild(svgEl("path", {
        d: "M " + x + " " + y1 + " C " + x + " " + mid + ", " + x + " " + mid + ", " + x + " " + y2,
        stroke: color, "stroke-width": "2", fill: "none", opacity: "0.55"
      }));
    }
    lastVisByBranch[c.branch] = vi;
  });

  // -- Draw merge lines: CLI-style straight segments like git log --graph --
  // Shape: vertical down → 45° diagonal → arrive at target node.
  // The diagonal segment spans exactly |dx| pixels horizontally,
  // so it slopes at 45° regardless of lane distance.
  merges.forEach(function(m) {
    const fromC = commits.find(function(c) { return c.hash === m.from; });
    const intoC = commits.find(function(c) { return c.hash === m.into; });
    if (!fromC || !intoC) return;
    if (!activeBranches.has(fromC.branch) || !activeBranches.has(intoC.branch)) return;
    if (visIdxByHash[m.from] == null || visIdxByHash[m.into] == null) return;

    const fx = commitX(fromC.branch);
    const fy = rowY(visIdxByHash[m.from]);
    const tx = commitX(intoC.branch);
    const ty = rowY(visIdxByHash[m.into]);
    const color = branchColor(fromC.branch);

    // The diagonal covers |fx - tx| horizontal distance at 45°, same vertical distance.
    const dx = Math.abs(fx - tx);
    // Diagonal starts at (fx, ty - dx) and ends at (tx, ty).
    // Vertical segment: from (fx, fy) straight down to where diagonal begins.
    const diagStartY = ty - dx;
    // If the vertical segment has no room (nodes very close), skip straight to diagonal.
    const d = (diagStartY > fy)
      ? "M " + fx + " " + fy + " L " + fx + " " + diagStartY + " L " + tx + " " + ty
      : "M " + fx + " " + fy + " L " + tx + " " + ty;

    // Glow
    svg.appendChild(svgEl("path", {
      d: d, stroke: color, "stroke-width": "4", fill: "none", opacity: "0.07"
    }));
    // Main dashed line
    svg.appendChild(svgEl("path", {
      d: d, stroke: color, "stroke-width": "1.5", fill: "none",
      opacity: "0.6", "stroke-dasharray": "4 3", "stroke-linejoin": "round"
    }));
    // Small arrowhead pointing into target along the diagonal direction
    const aw = 4, ah = 7;
    // Arrow direction: from diagStart toward (tx, ty)
    const adx = tx - fx, ady = ty - diagStartY;
    const len = Math.sqrt(adx * adx + ady * ady) || 1;
    const ux = adx / len, uy = ady / len;  // unit vector along diagonal
    const px = -uy, py = ux;               // perpendicular
    const tip = [tx, ty - 1];
    const b1  = [tx - ux * ah + px * aw, ty - 1 - uy * ah + py * aw];
    const b2  = [tx - ux * ah - px * aw, ty - 1 - uy * ah - py * aw];
    svg.appendChild(svgEl("polygon", {
      points: tip[0]+","+tip[1]+" "+b1[0]+","+b1[1]+" "+b2[0]+","+b2[1],
      fill: color, opacity: "0.75"
    }));
  });

  // -- Draw nodes on top --
  vis.forEach(function(c, vi) {
    const color = branchColor(c.branch);
    const x = commitX(c.branch);
    const y = rowY(vi);

    if (c.type === "fail") {
      const s = NODE_R * 0.9;
      svg.appendChild(svgEl("line", { x1: x-s, y1: y-s, x2: x+s, y2: y+s, stroke: color, "stroke-width": "2.5", "stroke-linecap": "round" }));
      svg.appendChild(svgEl("line", { x1: x+s, y1: y-s, x2: x-s, y2: y+s, stroke: color, "stroke-width": "2.5", "stroke-linecap": "round" }));
    } else if (c.type === "merge") {
      svg.appendChild(svgEl("circle", { cx: x, cy: y, r: NODE_R + 4, fill: "none", stroke: color, "stroke-width": "1.5", opacity: "0.4" }));
      svg.appendChild(svgEl("circle", { cx: x, cy: y, r: NODE_R,     fill: "#0d1117", stroke: color, "stroke-width": "2.5" }));
    } else if (c.type === "tag-release") {
      const s = NODE_R + 4;
      svg.appendChild(svgEl("circle", { cx: x, cy: y, r: s + 5, fill: "none", stroke: color, "stroke-width": "1", opacity: "0.2" }));
      svg.appendChild(svgEl("polygon", { points: x+","+( y-s)+" "+(x+s)+","+y+" "+x+","+(y+s)+" "+(x-s)+","+y, fill: color, stroke: "#f0c040", "stroke-width": "1.5" }));
    } else if (c.type === "tag-milestone") {
      const s = NODE_R + 2;
      svg.appendChild(svgEl("polygon", { points: x+","+( y-s)+" "+(x+s)+","+y+" "+x+","+(y+s)+" "+(x-s)+","+y, fill: color, stroke: "#f0c040", "stroke-width": "1" }));
    } else {
      svg.appendChild(svgEl("circle", { cx: x, cy: y, r: NODE_R, fill: color }));
    }
  });
}

// ── RELEASES ──
function buildReleases() {
  const list = document.getElementById("releases-list");
  list.innerHTML = "";
  commits.filter(function(c) { return c.tags.length > 0; }).forEach(function(c) {
    c.tags.forEach(function(tag) {
      const card = document.createElement("div");
      card.className = "release-card";
      card.innerHTML = "<div class='rc-icon'>" + (c.type === "tag-release" ? "★" : "◆") + "</div>"
        + "<div><div class='rc-tag'>" + tag + "</div><div class='rc-date'>" + c.date + "</div><div class='rc-msg'>" + c.message + "</div></div>";

function buildBranchLegend() {

  el.innerHTML = "";

    const name = pair[0], cfg = pair[1];

// ── SCRUBBER ──
const YEARS = [2020, 2021, 2022, 2023, 2024, 2025, 2026];

function buildScrubber() {
  const el = document.getElementById("scrubber");
  el.innerHTML = "";
  YEARS.forEach(function(year) {
    const item = document.createElement("div");
    item.className = "tl-item";
    item.dataset.year = year;
    item.innerHTML = "<span class='tl-label'>" + year + "</span><div class='tl-pip'></div>";
    item.addEventListener("click", function() {
      const row = document.querySelector(".commit-row[data-year='" + year + "']:not(.branch-hidden)");
      if (row) row.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    el.appendChild(item);
  });
}

function updateScrubber() {
  const mid = window.scrollY + window.innerHeight / 2;
  let best = null, bestDist = Infinity;
  document.querySelectorAll(".commit-row:not(.branch-hidden)").forEach(function(row) {
    const rect = row.getBoundingClientRect();
    const rowMid = window.scrollY + rect.top + rect.height / 2;
    const d = Math.abs(rowMid - mid);
    if (d < bestDist) { bestDist = d; best = row; }
  });
  const activeYear = best ? parseInt(best.dataset.year) : null;
  document.querySelectorAll(".tl-item").forEach(function(el) {
    el.classList.toggle("active", parseInt(el.dataset.year) === activeYear);
  });
}

// ── SCROLL OBSERVER ──
function setupObserver() {
  const obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) { e.target.classList.add("in-view"); obs.unobserve(e.target); }
    });
  }, { threshold: 0.05, rootMargin: "0px 0px -20px 0px" });
  document.querySelectorAll(".commit-row").forEach(function(r) { obs.observe(r); });
}

// ── BRANCH FILTER ──
document.querySelectorAll(".branch-pill").forEach(function(pill) {
  pill.addEventListener("click", function() {
    const branch = pill.dataset.branch;
    if (activeBranches.has(branch)) {
      if (activeBranches.size === 1) return;
      activeBranches.delete(branch);
      pill.classList.replace("active", "inactive");
    } else {
      activeBranches.add(branch);
      pill.classList.replace("inactive", "active");
    }
    document.querySelectorAll(".commit-row").forEach(function(row) {
      row.classList.toggle("branch-hidden", !activeBranches.has(row.dataset.branch));
    });
    buildSVG();
  });
});

// ── DETAIL PANEL ──
function openDetail(c) {
  selectedHash = c.hash;
  const color = branchColor(c.branch);
  document.getElementById("dp-hash").textContent = "commit " + c.hash;
  document.getElementById("dp-msg").textContent  = c.message;
  document.getElementById("dp-desc").textContent = c.description;

  const meta = document.getElementById("dp-meta");
  meta.innerHTML = "";

  const bp = document.createElement("span");
  bp.className = "cr-branch-pill";
  bp.textContent = c.branch;
  bp.style.color = color;
  bp.style.borderColor = color + "55";
  bp.style.background  = color + "18";
  meta.appendChild(bp);

  const dateEl = document.createElement("span");
  dateEl.className = "dp-date";
  dateEl.textContent = "📅 " + c.date;
  meta.appendChild(dateEl);

  c.tags.forEach(function(tag) {
    const tb = document.createElement("span");
    tb.className = "cr-tag" + (c.type === "tag-release" ? " release" : "");
    tb.textContent = (c.type === "tag-release" ? "★ " : "◆ ") + tag;
    meta.appendChild(tb);
  });

  const footer = document.getElementById("dp-footer");
  footer.innerHTML = c.type === "fail"
    ? "<span class='dp-badge fail'>&#10007; Mislukking / leerpunt</span>"
    : c.type === "merge"
    ? "<span class='dp-badge merge'>&#8853; Merge commit</span>"
    : "";

  document.getElementById("detail-panel").classList.add("open");
  document.getElementById("overlay").classList.add("on");

  document.querySelectorAll(".commit-row").forEach(function(r) { r.classList.remove("highlighted"); });
  var activeRow = document.querySelector(".commit-row[data-hash='" + c.hash + "']");
  if (activeRow) activeRow.classList.add("highlighted");
}

function closeDetail() {
  selectedHash = null;
  document.getElementById("detail-panel").classList.remove("open");
  document.getElementById("overlay").classList.remove("on");
  document.querySelectorAll(".commit-row").forEach(function(r) { r.classList.remove("highlighted"); });
}
document.getElementById("dp-close").addEventListener("click", closeDetail);
document.getElementById("overlay").addEventListener("click", closeDetail);

// ── TOOLTIP ──
const tooltip = document.getElementById("tooltip");
function showTooltip(e, c) {
  document.getElementById("tt-hash").textContent = c.hash;
  document.getElementById("tt-msg").textContent  = c.message;
  tooltip.classList.add("on");
  posTooltip(e);
}
function moveTooltip(e) { posTooltip(e); }
function hideTooltip()  { tooltip.classList.remove("on"); }
function posTooltip(e) {
  tooltip.style.left = Math.min(e.clientX + 18, window.innerWidth  - 320) + "px";
  tooltip.style.top  = Math.min(e.clientY + 18, window.innerHeight - 80)  + "px";
}

    "git branch -a": function() {
      return CMDS["git branch"]() + '\n'
           + '<span class="dim">  remotes/origin/education</span>\n'
           + '<span class="dim">  remotes/origin/HEAD -&gt; origin/education</span>';
    },
    "git status": function() {
      return '<span class="hi">Op branch education</span>\n'
           + '<span class="ok">Afstuderen bijna voltooid.</span>\n'
           + '\nChanges not staged for commit:\n'
           + '  <span class="ok">modified:   skills/typescript.ts</span>\n'
           + '  <span class="ok">modified:   skills/dotnet.cs</span>\n'
           + '  <span class="ok">new file:   life/afstuderen.md</span>\n'
           + '\n<span class="dim">geen bestanden gestaged voor commit</span>';
    },
    "ls": function() {
      return '<span class="bl">dans/</span>  <span class="bl">education/</span>  <span class="bl">international/</span>  <span class="bl">personal-growth/</span>  <span class="bl">work/</span>\nREADME.md  portfolio.html  .gitconfig';
    },
    "cat README.md": function() {
      return '<span class="hi"># Wouter Jacobs</span>\n'
           + '<span class="dim">Application Development &amp; Systems &middot; PXL Hasselt &middot; Graduating 2026</span>\n\n'
           + 'Welkom op mijn interactief Git-portfolio.\n'
           + 'Dit is geen gewone CV &mdash; het is een <span class="hi">volledige Git-geschiedenis van mijn leven</span>,\n'
           + 'gevisualiseerd als een branching commit graph.\n\n'
           + 'Ik ben Wouter Jacobs, een gepassioneerde software developer en\n'
           + 'competitief koppeldanser uit Belgi&euml;. Mijn pad was niet lineair &mdash;\n'
           + 'mislukkingen, omwegen en onverwachte avonturen maakten me wie ik ben.\n\n'
           + '<span class="dim"># Klik op een commit node om meer te lezen.</span>\n'
           + '<span class="dim"># Gebruik de branch-filters bovenaan om te filteren.</span>';
    },
  };

  function run(cmd) {
    const t = cmd.trim();
    if (!t) return;
    cmdHistory.unshift(t);
    histIdx = -1;

    if (t === "clear") { body.innerHTML = ""; return; }

    if (/^git\s+log/.test(t)) {
      appendCmd(t, '<span class="ok">&rarr; Rendering commit graph...</span>');
      setTimeout(function() {
        document.getElementById("graph-area").scrollIntoView({ behavior: "smooth", block: "start" });
      }, 350);
      return;
    }

    const handler = CMDS[t];
    if (handler) { appendCmd(t, handler()); return; }

    appendCmd(t, '<span class="err">bash: ' + esc(t.split(" ")[0]) + ': command not found</span>\n'
                 + '<span class="dim">Probeer <span class="hi">help</span> voor beschikbare commando\'s.</span>');
  }

  input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      const cmd = input.value; input.value = ""; run(cmd);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (histIdx < cmdHistory.length - 1) input.value = cmdHistory[++histIdx];
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      histIdx > 0 ? input.value = cmdHistory[--histIdx] : (histIdx = -1, input.value = "");
    }
  });

  termEl.addEventListener("click", function() { input.focus(); });

  // Boot: auto-run cat README.md, then git log
  appendCmd("cat README.md", CMDS["cat README.md"]());
  setTimeout(function() {
    appendCmd("git log --graph --oneline --all --decorate -- wouter-jacobs",
      '<span class="ok">&rarr; Rendering commit graph below...</span>');
  }, 300);
})();

// ── SCROLL ──
window.addEventListener("scroll", updateScrubber, { passive: true });

// ── INIT ──
buildRows();
updateScrubber();
</script>
